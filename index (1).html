<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Skater’s Bible – prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#d4d5d0;--surface:#e9eae6;--ink:#1a1c22;--muted:#5a5d66;--red:#e4322b;--blue:#2a5bd7;--yellow:#f2bf00;--line:#1a1c22;--onaccent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181c;--surface:#23252b;--ink:#ecebe6;--muted:#9a9da6;--red:#ff5a4d;--blue:#6f9bff;--yellow:#ffd23a;--line:#ecebe6}}
:root[data-theme="dark"]{--bg:#17181c;--surface:#23252b;--ink:#ecebe6;--muted:#9a9da6;--red:#ff5a4d;--blue:#6f9bff;--yellow:#ffd23a;--line:#ecebe6}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.4;display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
header{padding:18px 18px 14px;background:#1a1c22;color:#ecebe6;position:relative;overflow:hidden;text-align:center}
header::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.2px);background-size:4px 4px;pointer-events:none}
.logo{font-family:"Archivo Black",Impact,sans-serif;font-size:30px;line-height:.95;position:relative;z-index:1}
.logo span{display:inline-block;background:var(--yellow);color:#1a1c22;padding:2px 8px;transform:rotate(-2deg);margin-top:4px}
.tag{position:relative;z-index:1;font-size:13px;opacity:.8;margin-top:6px}
.book{position:relative;z-index:1;display:block;width:100%;max-width:230px;margin:0 auto}
main{flex:1;padding:16px 16px 90px}
h2{font-family:"Archivo Black",Impact,sans-serif;font-size:22px;margin:18px 0 10px;font-weight:400}
h2:first-child{margin-top:4px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
.wx{display:flex;align-items:center;gap:14px;background:var(--blue);color:#fff;border-color:var(--line)}
.wx .t{font-family:"Archivo Black",sans-serif;font-size:44px;line-height:1}
.wx b{display:block;font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub{color:var(--muted);font-size:14px}
.bar{height:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--red)}
.chip{font-size:13px;font-weight:600;border:2px solid var(--line);border-radius:20px;padding:2px 10px;white-space:nowrap}
.btn{font:inherit;font-weight:600;background:var(--red);color:#fff;border:2px solid var(--line);border-radius:6px;padding:10px 14px;width:100%;margin-top:10px;cursor:pointer}
.btn.out{background:var(--ink);color:var(--bg)}
button{cursor:pointer}
.park{width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px;display:block}
.park:focus-visible,.btn:focus-visible,nav button:focus-visible,.trick>button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.map{background:var(--surface);border:2px solid var(--line);border-radius:6px;margin-bottom:12px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.pin circle{fill:var(--red);stroke:var(--ink);stroke-width:2}
.pin.sel circle{fill:var(--yellow);r:11}
.pin text{font:600 10px Barlow,sans-serif;fill:var(--ink)}
.land{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.trick{background:var(--surface);border:2px solid var(--line);border-radius:6px;margin-bottom:10px}
.trick>button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;font:inherit;color:inherit;padding:12px 14px;text-align:left}
.box{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:4px;display:grid;place-items:center;background:var(--bg);font-weight:700;color:#fff}
.done .box{background:var(--blue)}
.name{flex:1;font-weight:600;font-size:17px}
.lvl{font-size:13px;color:var(--muted)}
.more{padding:0 14px 14px;display:none}
.open .more{display:block}
.more ol{padding-left:20px;margin:6px 0 10px}
.vid{aspect-ratio:16/9;background:var(--ink);color:var(--bg);display:grid;place-items:center;border-radius:4px;margin:10px 0;font-weight:600}
.mini{background:none;border:2px solid var(--line);border-radius:6px;font:inherit;font-weight:600;color:inherit;padding:6px 12px}
.mini.on{background:var(--blue);color:#fff}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;background:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--bg);opacity:.65;font:600 14px Barlow,sans-serif;padding:14px 4px}
nav button[aria-current="page"]{opacity:1;box-shadow:inset 0 -4px 0 var(--yellow)}
.note a{color:inherit}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="book" viewBox="0 0 240 190" role="img" aria-label="The Skater’s Bible"><g transform="rotate(-4 120 95)"><rect x="34" y="26" width="182" height="150" rx="5" fill="#f3efe2" stroke="#0d0e11" stroke-width="3"/><path d="M42 172H212M42 167H212" stroke="#c9c3ae" stroke-width="1.5"/><rect x="22" y="14" width="182" height="150" rx="5" fill="#2a5bd7" stroke="#0d0e11" stroke-width="3"/><rect x="22" y="14" width="24" height="150" rx="5" fill="#1d3f9a" stroke="#0d0e11" stroke-width="3"/><path d="M52 22V156" stroke="#6f9bff" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="168" y="22" width="28" height="20" rx="2" fill="#e4322b" stroke="#0d0e11" stroke-width="2" transform="rotate(6 182 32)"/><text x="58" y="44" font-family="Archivo Black,Impact,sans-serif" font-size="15" fill="#fff" transform="rotate(-6 100 40)">The</text><g transform="rotate(-6 120 80)"><text x="60" y="86" font-family="Archivo Black,Impact,sans-serif" font-size="30" textLength="136" lengthAdjust="spacingAndGlyphs" fill="#e4322b" stroke="#0d0e11" stroke-width="5" paint-order="stroke">Skater’s</text><text x="57" y="83" font-family="Archivo Black,Impact,sans-serif" font-size="30" textLength="136" lengthAdjust="spacingAndGlyphs" fill="#f2bf00" stroke="#0d0e11" stroke-width="2" paint-order="stroke">Skater’s</text></g><g transform="rotate(-4 120 125)"><text x="58" y="136" font-family="Archivo Black,Impact,sans-serif" font-size="48" textLength="138" lengthAdjust="spacingAndGlyphs" fill="#e4322b" stroke="#0d0e11" stroke-width="6" paint-order="stroke">Bible</text><text x="55" y="133" font-family="Archivo Black,Impact,sans-serif" font-size="48" textLength="138" lengthAdjust="spacingAndGlyphs" fill="#f2bf00" stroke="#0d0e11" stroke-width="2" paint-order="stroke">Bible</text><g stroke="#f2bf00" stroke-width="3" stroke-linecap="round" fill="#f2bf00"><path d="M78 138v12"/><circle cx="78" cy="153" r="2.5"/><path d="M118 138v22"/><circle cx="118" cy="163" r="2.5"/><path d="M162 138v8"/><circle cx="162" cy="149" r="2.5"/></g></g></g></svg>
    <div class="tag">Parks, tricks and sessions for UK skaters</div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<script>
var parks=[
 {n:"Southbank Undercroft",c:"London",la:51.507,lo:-0.117,wx:"Light rain · 11°",busy:70,w:12,d:"Concrete, ledges and banks"},
 {n:"Stockwell Skatepark",c:"London",la:51.473,lo:-0.118,wx:"Light rain · 11°",busy:45,w:8,d:"Bowl and street section"},
 {n:"Projekts MCR",c:"Manchester",la:53.487,lo:-2.229,wx:"Cloudy · 9°",busy:25,w:5,d:"Indoor, open all weather"},
 {n:"Rom Skatepark",c:"Romford",la:51.575,lo:0.19,wx:"Dry · 12°",busy:85,w:17,d:"Large outdoor park"},
 {n:"The Level",c:"Brighton",la:50.834,lo:-0.134,wx:"Windy · 12°",busy:55,w:9,d:"Outdoor park by the seafront"},
 {n:"Kelvingrove",c:"Glasgow",la:55.869,lo:-4.285,wx:"Showers · 7°",busy:30,w:4,d:"Outdoor street plaza"},
 {n:"Cardiff Bay Skatepark",c:"Cardiff",la:51.468,lo:-3.165,wx:"Dry · 10°",busy:20,w:3,d:"Bowls and a street section"},
 {n:"Ponderosa Skatepark",c:"Sheffield",la:53.381,lo:-1.545,wx:"Overcast · 8°",busy:40,w:6,d:"Outdoor park with flow lines"}
];
var tricks=[
 {n:"Ollie",l:"Beginner",s:["Feet over the bolts, back foot on the tail","Pop the tail and jump","Slide your front foot up to level out","Land on both feet over the bolts"],h:"Invented by Alan “Ollie” Gelfand in the late 1970s. Almost every other trick builds on it."},
 {n:"Pop shove-it",l:"Beginner",s:["Back foot on the tail, front foot over the bolts","Pop and scoop the tail backwards","Let the board spin 180 degrees","Catch it with your feet and roll away"],h:"Developed by Rodney Mullen in the early 1980s, from his freestyle skating."},
 {n:"Kickflip",l:"Intermediate",s:["Angle your front foot slightly off the edge","Pop and flick your toes up and out","Watch the board spin once","Catch it with your back foot first, then land"],h:"Popularised by Rodney Mullen in the 1980s. It is the trick most people list as their first big goal."},
 {n:"Heelflip",l:"Intermediate",s:["Front foot sits slightly forward, toes off the edge","Pop and flick your heel out and forward","Let the board flip once","Catch and land over the bolts"],h:"The mirror image of the kickflip, and a staple of street skating since the 1980s."},
 {n:"Frontside 180",l:"Intermediate",s:["Open your shoulders in the direction you spin","Pop an ollie as you turn","Spot your landing","Land on the bolts and ride away"],h:"One of the first rotating ollie tricks. It is the foundation for bigger spins."},
 {n:"Boardslide",l:"Advanced",s:["Approach the rail or ledge at a slight angle","Ollie up and turn 90 degrees","Land with the middle of the board on the edge","Slide, then turn out and land"],h:"One of the oldest slide tricks, and the first one most skaters learn on a rail."}
];
var st={tab:"home",sel:0,pick:1,done:{Ollie:true},open:null,checked:{},play:"Street sessions"};
var tabs=[["home","Home"],["parks","Parks"],["tricks","Tricks"]];
var uk=[[-5.7,50.05],[-5.2,49.96],[-4.2,50.35],[-3.5,50.2],[-2.4,50.6],[-1.3,50.75],[-0.2,50.8],[0.3,50.77],[1.4,51.15],[1.4,51.38],[0.7,51.5],[1.28,51.93],[1.75,52.45],[1.7,52.75],[0.4,52.95],[0.3,53.3],[0.1,53.6],[-0.1,54.1],[-0.6,54.5],[-1.2,54.6],[-1.4,55.0],[-1.7,55.7],[-2.5,56.0],[-2.0,56.7],[-2.1,57.15],[-1.8,57.5],[-3.3,57.7],[-4.2,57.5],[-3.9,57.9],[-3.1,58.65],[-5.0,58.6],[-5.7,57.5],[-5.6,56.4],[-5.7,55.5],[-4.9,55.5],[-5.1,54.85],[-4.4,54.65],[-3.4,54.5],[-3.0,54.1],[-3.0,53.6],[-3.5,53.3],[-4.6,53.3],[-4.7,52.85],[-4.1,52.6],[-4.1,52.2],[-5.2,51.9],[-4.2,51.55],[-3.2,51.45],[-2.7,51.45],[-3.2,51.2],[-4.6,51.0],[-5.2,50.3]];
function px(q){var lo=q.lo!==undefined?q.lo:q[0],la=q.la!==undefined?q.la:q[1];return[60+(lo+6.3)*31.8,20+(58.8-la)*50.5]}
var ukPath="M"+uk.map(function(c){var p=px(c);return p[0].toFixed(1)+" "+p[1].toFixed(1)}).join(" L")+"Z";
var WX={0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Light showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Snow showers",95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"};
function outlook(d){
 var t=d.hourly.time,pr=d.hourly.precipitation,i=t.indexOf(d.current.time.slice(0,13)+":00");
 if(i<0)i=0;
 var wet=d.current.precipitation>0||pr[i]>0.1;
 for(var j=i+1;j<pr.length;j++){
  if(wet&&pr[j]<=0.1)return "Dry from "+t[j].slice(11,16);
  if(!wet&&pr[j]>0.1)return "Rain expected from "+t[j].slice(11,16);
 }
 return wet?"Wet for the rest of the day":"Dry for the rest of the day"}
function wxCard(){
 var p=parks[0],l=p.live;
 if(p.err)return '<div class="card wx"><div class="t">--</div><div><b>Weather unavailable</b>Check your connection</div></div>';
 if(!l)return '<div class="card wx"><div class="t">--°</div><div><b>Loading weather…</b>'+p.c+'</div></div>';
 return '<div class="card wx"><div class="t">'+l.t+'°</div><div><b>'+l.txt+'</b>'+l.out+' · '+p.c+'</div></div>'}
function loadWeather(){
 parks.forEach(function(p){p.wx="Weather loading…"});
 Promise.all(parks.map(function(p){
  var u="https://api.open-meteo.com/v1/forecast?latitude="+p.la+"&longitude="+p.lo+"&current=temperature_2m,precipitation,weather_code&hourly=precipitation&forecast_days=2&timezone=Europe%2FLondon";
  return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
   p.live={t:Math.round(d.current.temperature_2m),txt:WX[d.current.weather_code]||"Unsettled",out:outlook(d)};
   p.err=false;p.wx=p.live.txt+" · "+p.live.t+"°";
  }).catch(function(){p.err=true;p.wx="Weather unavailable"});
 })).then(render)}
function busyLabel(v){return v>66?"Busy":v>33?"Fairly quiet":"Quiet"}
function nav(){var h="";tabs.forEach(function(t){h+='<button data-tab="'+t[0]+'"'+(st.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>'});document.getElementById("nav").innerHTML=h}
function home(){
 var h='<h2>Right now</h2>'+wxCard();
 h+='<h2>How busy are the parks?</h2>';
 parks.forEach(function(p,i){if(i>3)return;var c=st.checked[i]||0,b=Math.min(100,p.busy+c*3);h+='<button class="park" data-park="'+i+'"><div class="row"><b>'+p.n+'</b><span class="chip">'+busyLabel(b)+'</span></div><div class="sub">'+p.c+' · '+(p.w+c)+' skaters checked in</div><div class="bar"><i style="width:'+b+'%"></i></div></button>'});
 h+='<h2>Playlists</h2><div class="card"><div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:10px">';
 ["Street sessions","Chill cruise","Old school"].forEach(function(p){h+='<button class="mini'+(st.play===p?' on':'')+'" data-play="'+p+'">'+p+'</button>'});
 h+='</div><div class="sub">Opens in your music app</div><div class="row" style="margin-top:8px"><span class="chip">Spotify</span><span class="chip">Apple Music</span><span class="chip">YouTube Music</span></div></div>';
 return h}
function parksView(){
 var p=parks[st.sel],c=st.checked[st.sel]||0,bz=Math.min(100,p.busy+c*3);
 var h='<h2>Skateparks</h2><div class="map"><svg viewBox="0 0 400 480" role="img" aria-label="Map of UK skateparks"><path class="land" d="'+ukPath+'"/>';
 parks.forEach(function(q,i){h+='<g class="pin'+(i===st.sel?' sel':'')+'" data-pin="'+i+'" tabindex="0" role="button" aria-label="'+q.n+'"><circle cx="'+px(q)[0]+'" cy="'+px(q)[1]+'" r="8"/>'+(i===st.sel?'<text x="'+(px(q)[0]+14)+'" y="'+(px(q)[1]+4)+'">'+q.c+'</text>':'')+'</g>'});
 h+='</svg></div><div class="card"><div class="row"><b style="font-size:19px">'+p.n+'</b><span class="chip">'+busyLabel(bz)+'</span></div><div class="sub">'+p.c+' · '+(p.w+c)+' skaters checked in</div><p style="margin-top:6px">'+p.d+'</p><span class="chip" style="display:inline-block;margin-top:8px">'+p.wx+'</span>';
 if(c){h+='<p style="margin-top:10px"><b>You checked in '+c+(c>1?' skaters':' skater')+'.</b></p><div class="sub">Check-ins end automatically after 2 hours.</div><button class="btn out" data-check="'+st.sel+'">Check out</button></div>';}
 else{h+='<div style="margin-top:12px"><b>Who’s skating?</b><div class="row" style="justify-content:flex-start;gap:14px;margin:8px 0"><button class="mini" data-minus="1" aria-label="One fewer">−</button><b style="font-size:22px;min-width:28px;text-align:center">'+st.pick+'</b><button class="mini" data-plus="1" aria-label="One more">+</button><span class="sub">'+(st.pick===1?'Just me':'Me and '+(st.pick-1)+' more')+'</span></div><button class="btn" data-check="'+st.sel+'">Check in '+st.pick+(st.pick>1?' skaters':' skater')+'</button></div></div>';}
 return h}
function tricksView(){
 var n=0;tricks.forEach(function(t){if(st.done[t.n])n++});
 var h='<h2>Trick checklist</h2><div class="card"><div class="row"><b>'+n+' of '+tricks.length+' landed</b><span class="sub">Tap a trick to learn it</span></div><div class="bar"><i style="width:'+(n/tricks.length*100)+'%;background:var(--blue)"></i></div></div>';
 tricks.forEach(function(t){var d=st.done[t.n],o=st.open===t.n;
 h+='<div class="trick'+(d?' done':'')+(o?' open':'')+'"><button data-trick="'+t.n+'" aria-expanded="'+o+'"><span class="box" data-tick="'+t.n+'">'+(d?'✓':'')+'</span><span class="name">'+t.n+'</span><span class="lvl">'+t.l+'</span></button><div class="more"><div class="vid">Video tutorial</div><b>How to</b><ol>';
 t.s.forEach(function(s){h+='<li>'+s+'</li>'});
 h+='</ol><b>History</b><p>'+t.h+'</p><button class="mini'+(d?' on':'')+'" style="margin-top:10px" data-land="'+t.n+'">'+(d?'Landed':'Mark as landed')+'</button></div></div>'});
 return h}
function render(){
 var m=document.getElementById("main");
 m.innerHTML=st.tab==="home"?home():st.tab==="parks"?parksView():tricksView();
 m.insertAdjacentHTML("beforeend",'<div class="note">Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a>. Park busyness and check-ins are sample data for now.</div>');
 nav()}
document.addEventListener("click",function(e){
 var el=e.target.closest("[data-tab],[data-park],[data-pin],[data-check],[data-minus],[data-plus],[data-trick],[data-land],[data-play]");if(!el)return;
 var d=el.dataset;
 if(d.tab){st.tab=d.tab;window.scrollTo(0,0)}
 else if(d.park!==undefined){st.sel=+d.park;st.tab="parks";window.scrollTo(0,0)}
 else if(d.pin!==undefined){st.sel=+d.pin}
 else if(d.check!==undefined){st.checked[d.check]=st.checked[d.check]?0:st.pick}
 else if(d.minus){st.pick=Math.max(1,st.pick-1)}
 else if(d.plus){st.pick=Math.min(15,st.pick+1)}
 else if(d.trick){st.open=st.open===d.trick?null:d.trick}
 else if(d.land){st.done[d.land]=!st.done[d.land]}
 else if(d.play){st.play=d.play}
 render()});
document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.pin!==undefined){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
render();loadWeather();
</script>
</body>
</html>
